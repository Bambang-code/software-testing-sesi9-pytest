name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependensi pengujian
        run: python -m pip install -r requirements-dev.txt
      - name: Jalankan unit test dan branch coverage
        run: python -m pytest -v --cov=perpustakaan --cov-branch --cov-report=term-missing
